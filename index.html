<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诗词</title>
    <script>
      // 主题：启动即应用，避免闪白
      (function () {
        try {
          var t = localStorage.getItem("poetry-theme");
          if (t === "warm" || t === "ink" || t === "blue") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
