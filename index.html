<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>诗词</title>
    <!--
      首帧骨架：Tauri 打开窗口到 React（526KB JS + 词库）执行完之间有 1~3 秒，
      之前这段时间是空白页，看起来像「卡住了」。这里把骨架直接写进 HTML，
      WebView 解析完就能画出与正式界面同构的占位（顶栏 + 标题 + 卡片网格），
      React 挂载到 #root 时会自动清掉它。颜色与 src/index.css 的主题变量保持一致。
    -->
    <style>
      :root {
        --boot-bg: #fdf2f8;
        --boot-fg: #db2777;
        --boot-soft: #f472b6;
        --boot-card: #ffffff;
      }
      [data-theme="warm"] {
        --boot-bg: #fef3c7;
        --boot-fg: #78350f;
        --boot-soft: #b45309;
        --boot-card: #fffdf6;
      }
      [data-theme="ink"] {
        --boot-bg: #fafaf9;
        --boot-fg: #1c1917;
        --boot-soft: #44403c;
        --boot-card: #ffffff;
      }
      [data-theme="blue"] {
        --boot-bg: #f8fafc;
        --boot-fg: #0f172a;
        --boot-soft: #334155;
        --boot-card: #ffffff;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--boot-bg);
      }
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
      }
      .boot-nav {
        height: 3.5rem;
        display: flex;
        align-items: center;
        gap: 1.25rem;
        padding: 0 1.5rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.06);
      }
      .boot-logo {
        font-size: 1.125rem;
        font-weight: 700;
        color: var(--boot-fg);
        letter-spacing: 0.08em;
      }
      .boot-nav-item {
        height: 0.75rem;
        width: 3rem;
        border-radius: 9999px;
        background: var(--boot-soft);
        opacity: 0.35;
      }
      .boot-main {
        width: 100%;
        max-width: 72rem;
        margin: 0 auto;
        padding: 1.75rem 1.5rem;
        flex: 1;
      }
      .boot-line {
        height: 1rem;
        border-radius: 9999px;
        background: var(--boot-soft);
        opacity: 0.35;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-line-lg {
        height: 1.75rem;
        width: 16rem;
        max-width: 70%;
      }
      .boot-line-sm {
        margin-top: 0.875rem;
        width: 26rem;
        max-width: 90%;
      }
      .boot-grid {
        margin-top: 2rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fill, minmax(14rem, 1fr));
      }
      .boot-card {
        height: 7.5rem;
        border-radius: 0.75rem;
        background: var(--boot-card);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      .boot-hint {
        margin-top: 1.75rem;
        font-size: 0.8125rem;
        color: var(--boot-fg);
        opacity: 0.5;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.45;
        }
        50% {
          opacity: 0.15;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-line,
        .boot-card {
          animation: none;
        }
      }
    </style>
    <script>
      // 主题：启动即应用，避免闪白
      (function () {
        try {
          var t = localStorage.getItem("poetry-theme");
          if (t === "warm" || t === "ink" || t === "blue") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="root">
      <div class="boot" role="status" aria-live="polite" aria-label="正在启动诗词">
        <div class="boot-nav">
          <span class="boot-logo">诗词</span>
          <span class="boot-nav-item"></span>
          <span class="boot-nav-item"></span>
          <span class="boot-nav-item"></span>
          <span class="boot-nav-item"></span>
        </div>
        <div class="boot-main">
          <div class="boot-line boot-line-lg"></div>
          <div class="boot-line boot-line-sm"></div>
          <div class="boot-grid">
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
            <div class="boot-card"></div>
          </div>
          <p class="boot-hint">正在打开诗词库…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
