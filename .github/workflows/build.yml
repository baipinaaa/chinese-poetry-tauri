# 由 GitHub Actions 编译 Tauri 桌面应用（本机没有编译条件，全部在云端完成）
#
# 触发方式（三种都会在构建成功后自动创建 Release，安装包直接挂在 Release 上）：
#   1. 手动：Actions → Build → Run workflow（可选填版本号与数据库下载地址）→ 正式版 Release
#   2. 打标签：git push origin v0.1.0 → 正式版 Release（tag 就是版本号）
#   3. push main：自动发一个预览版 Release（prerelease，tag 形如 main-123），只验功能不发正式版；
#      预览版不带数据库，因此永远不占用「最新 Release」，fetch-db 拿到的一定是正式版的库
#   4. PR：只做类型检查与前端构建，不打包
#
# Release 只在最后那个 release job 里创建一次：三个平台的矩阵任务并发跑，若各自去创建 Release
# 会互相覆盖（draft 版按 tag 查不到，会生成多个同名草稿），所以先各自上传构建产物，再统一发布。
#
# 数据库（poetry_index.db，约 216MB）不提交进 Git，获取顺序见 scripts/fetch-db.mjs：
#   ① 本机已有文件  ② POETRY_DB_URL（手动触发时的 db_url 输入或仓库 Secret）
#   ③ 本仓库最新 Release 里的 poetry_index.db 资产  ④ 都没有 → 0 字节占位（应用启动后提示导入）
name: Build

on:
  workflow_dispatch:
    inputs:
      db_url:
        description: "poetry_index.db 下载地址（留空则尝试从本仓库最新 Release 获取）"
        required: false
        default: ""
      version:
        description: "Release 版本号，如 0.1.0（留空则自动用 0.1.<构建号>）"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# 同一分支/标签只保留最新一次构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 传给 scripts/fetch-db.mjs；手动触发时用输入值，否则用仓库 Secret（没配就是空）
  POETRY_DB_URL: ${{ github.event.inputs.db_url || secrets.POETRY_DB_URL }}
  CARGO_TERM_COLOR: always
  # 前端构建失败时不要静默降级
  CI: true

jobs:
  # ---------- 1. 前端类型检查（快速失败，不必等 Rust 编译） ----------
  typecheck:
    name: 类型检查 / 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run typecheck # 类型错误必须修掉：build job 的 tauri:build 会触发 beforeBuildCommand（tsc + vite build），同样会跑一遍

      - name: 前端构建（vite build）
        run: npx vite build

  # ---------- 2. 打包（Windows / Linux / macOS Apple Silicon） ----------
  build:
    name: 打包 ${{ matrix.name }}
    needs: typecheck
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64, NSIS)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: Linux (x64, deb + AppImage)
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: macOS (Apple Silicon, dmg)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: 获取诗词数据库
        run: node scripts/fetch-db.mjs

      # 只有拿到真实库（> 1MB）时才值得随 Release 上传；0 字节占位文件跳过
      - name: 检查数据库是否为真实库
        id: dbcheck
        shell: bash
        run: |
          f=src-tauri/resources/poetry_index.db
          size=$(wc -c < "$f" 2>/dev/null || echo 0)
          if [ "$size" -gt 1048576 ]; then
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "已获取真实数据库（约 $((size / 1024 / 1024)) MB）"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "未获取到真实数据库（当前 $size 字节），跳过 Release 上传"
          fi

      - name: 应用图标（仓库已内置 src-tauri/icons，仅在缺失时由 app-icon.svg 兜底生成）
        shell: bash
        run: |
          if [ -f src-tauri/icons/icon.ico ]; then
            echo "使用仓库内已有图标"
          else
            npm run tauri:icon || echo "图标生成失败，继续（可能缺少图标）"
          fi

      - name: 编译并打包
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: 收集安装包
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          if-no-files-found: warn
          compression-level: 0 # 安装包本身已压缩，再压只会浪费时间
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage

      # 数据库作为临时产物交给 release job 一起发布（仅 Linux 那次、仅正式版、且确实拿到真库时）。
      # 好处：下次构建时 scripts/fetch-db.mjs 能从本仓库最新 Release 自动取到 216MB 的库，
      # 不用把它提交进 Git，也不用每次手动填下载地址。
      # retention-days: 1 —— artifact 只当中转站，发完就不用留着占存储配额。
      - name: 上传数据库供发布使用（仅 Linux、正式版、且取到真实库时）
        if: matrix.platform == 'ubuntu-22.04' && steps.dbcheck.outputs.real == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: db-poetry
          path: src-tauri/resources/poetry_index.db
          compression-level: 0
          retention-days: 1

  # ---------- 3. 发布 Release（整个工作流里唯一创建 Release 的地方） ----------
  release:
    name: 发布 Release
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # 决定 Release 的标签名，以及是正式版还是预览版
      - name: 计算版本标签
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            pre=false
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            v="${INPUT_VERSION#v}"
            v="${v:-0.1.${GITHUB_RUN_NUMBER}}"
            tag="v${v}"
            pre=false
          else
            tag="main-${GITHUB_RUN_NUMBER}"
            pre=true
          fi
          if [[ "$pre" == "true" ]]; then
            title="诗词 预览版 ${tag}"
          else
            title="诗词 ${tag}"
          fi
          {
            echo "tag=${tag}"
            echo "prerelease=${pre}"
            echo "title=${title}"
          } >> "$GITHUB_OUTPUT"
          echo "本次发布：tag=${tag}，prerelease=${pre}"

      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist

      # 正式版才带数据库；预览版没有这个产物，continue-on-error 保证不会因此失败
      - name: 下载数据库（仅正式版）
        if: steps.meta.outputs.prerelease == 'false'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: db-poetry
          path: dist

      - name: 列出待上传文件
        shell: bash
        run: ls -lh dist || true

      - name: 创建并发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          draft: false # 不再停在草稿：草稿不会成为「最新 Release」，fetch-db 也就取不到里面的数据库
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/**
