# 由 GitHub Actions 编译 Tauri 桌面应用（本机没有编译条件，全部在云端完成）
#
# 触发方式（都是**正式版** Release，安装包直接挂在 Release 附件里）：
#   1. 手动：Actions → Build → Run workflow（可填版本号；留空则用 v0.1.<构建号>）
#   2. 打标签：git push origin v0.1.0 → Release 版本号就是 tag
#   3. push main：自动发布 v0.1.<构建号>
#   4. PR：只做类型检查与前端构建，不打包
#
# 产物：Windows NSIS 安装器 + Windows 便携版 zip、Linux deb + AppImage、macOS Apple Silicon dmg
#
# Release 只在最后那个 release job 里创建一次：三个平台的矩阵任务并发跑，若各自去创建 Release
# 会互相覆盖（draft 版按 tag 查不到，会生成多个同名草稿），所以先各自上传构建产物，再统一发布。
#
# 数据库（poetry_index.db，约 480MB）不提交进 Git，获取顺序见 scripts/fetch-db.mjs：
#   ① 本机已有文件  ② POETRY_DB_URL（手动触发时的 db_url 输入或仓库 Secret）
#   ③ 本仓库最新 Release 里的 poetry_index.db 资产  ④ 都没有 → 0 字节占位（应用启动后提示导入）
#   ⑤ 本次构建跑了 data job（build_db=true）时，直接用云端刚建好的库，不再走 ①②③
#
# 云端重建数据库（可选，默认不跑）：手动触发时把 build_db 设为 true，并给出数据源压缩包地址
# （sources_url 输入或 Secret POETRY_SOURCES_URL，包内需含 gushiwen-main/、poems-db-master/、
#   chinese-gushiwen-master/ 三个目录）。data job 会先跑 Python 管线（scripts/build_db.py）建库，
# 三平台打包直接复用该库，并作为 Release 附件发布（之后 fetch-db.mjs 即可自动复用）。
#
# 版本号：打 tag 用 tag 名，其余为 0.1.<构建号>。它会被写进 package.json 与
# src-tauri/tauri.conf.json，所以安装包文件名、应用内版本、Release 标签三者始终一致。
name: Build

on:
  workflow_dispatch:
    inputs:
      db_url:
        description: "poetry_index.db 下载地址（留空则尝试从本仓库最新 Release 获取）"
        required: false
        default: ""
      version:
        description: "Release 版本号，如 0.1.0（留空则自动用 0.1.<构建号>）"
        required: false
        default: ""
      build_db:
        description: "是否在云端重建数据库（true/false；需要数据源压缩包地址）"
        required: false
        default: "false"
      sources_url:
        description: "数据源压缩包（gushiwen-main/ + poems-db-master/ + chinese-gushiwen-master/）下载地址；留空用 Secret POETRY_SOURCES_URL"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# 同一分支/标签只保留最新一次构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 传给 scripts/fetch-db.mjs；手动触发时用输入值，否则用仓库 Secret（没配就是空）
  POETRY_DB_URL: ${{ github.event.inputs.db_url || secrets.POETRY_DB_URL }}
  CARGO_TERM_COLOR: always
  # 前端构建失败时不要静默降级
  CI: true

jobs:
  # ---------- 0. （可选）云端重建数据库：仅当 build_db=true 时运行 ----------
  # 本机建好库再上传 Release 是更省事的主路径；这个 job 是给“没有本地构建条件”的场景用的。
  # 产物名固定为 db-poetry，与 build job 里 Linux 那组上传的临时产物同名，
  # 因此那组在 build_db=true 时会自动跳过上传，避免同名 artifact 冲突。
  data:
    name: 构建数据库（可选）
    if: github.event_name == 'workflow_dispatch' && inputs.build_db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # chinese-poetry 侧（诗集/标签/朝代/拼音）来自旧库，stage_final 的 --old-db 也用它
      - name: 获取旧库（chinese-poetry 侧基础库）
        run: node scripts/fetch-db.mjs --out _build/old_poetry_index.db

      - name: 检查旧库是否可用
        shell: bash
        run: |
          f=_build/old_poetry_index.db
          size=$(wc -c < "$f" 2>/dev/null || echo 0)
          echo "旧库大小：$size 字节"
          if [ "$size" -le 1048576 ]; then
            echo "::error::未拿到旧库：请配置 POETRY_DB_URL，或先发一次带 poetry_index.db 的 Release"
            exit 1
          fi

      - name: 下载并解包数据源（gushiwen / poems-db / chinese-gushiwen）
        shell: bash
        env:
          SOURCES_URL: ${{ github.event.inputs.sources_url || secrets.POETRY_SOURCES_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SOURCES_URL:-}" ]; then
            echo "::error::未提供数据源地址：把 gushiwen-main/ + poems-db-master/ + chinese-gushiwen-master/ 打成 data-sources.tar.gz 上传后，填 sources_url 或配置 Secret POETRY_SOURCES_URL"
            exit 1
          fi
          mkdir -p _sources
          curl -fL --retry 3 --retry-delay 5 -o data-sources.tar.gz "$SOURCES_URL"
          tar -xzf data-sources.tar.gz -C _sources
          ls -la _sources

      # 纯标准库实现（无第三方依赖），GUSHI_DATA_DIR 指定数据源目录
      - name: 构建数据库（scripts/build_db.py --stage all --fts）
        env:
          GUSHI_DATA_DIR: ${{ github.workspace }}/_sources
        run: python scripts/build_db.py --stage all --old-db _build/old_poetry_index.db --out _build/poetry_index.db --fts

      - name: 校验数据库（表与行数）
        run: |
          python - <<'PY'
          import sqlite3, os
          p = "_build/poetry_index.db"
          print(f"库大小：{os.path.getsize(p)/1024/1024:.1f} MB")
          c = sqlite3.connect(p)
          expect = {"poems": 400000, "authors": 20000, "dynasties": 20, "poem_content": 400000, "poems_fts": 400000}
          for t, low in expect.items():
              n = c.execute(f"SELECT COUNT(*) FROM {t}").fetchone()[0]
              print(f"{t}: {n:,}")
              assert n > low, t
          print("db-poetry ok: " + ", ".join(sorted(r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"))))
          PY

      - name: 上传数据库产物（供打包与发布复用）
        uses: actions/upload-artifact@v4
        with:
          name: db-poetry
          path: _build/poetry_index.db
          compression-level: 0
          retention-days: 1

  # ---------- 1. 前端类型检查（快速失败，不必等 Rust 编译） ----------
  typecheck:
    name: 类型检查 / 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run typecheck # 类型错误必须修掉：build job 的 tauri:build 会触发 beforeBuildCommand（tsc + vite build），同样会跑一遍

      - name: 前端构建（vite build）
        run: npx vite build

  # ---------- 2. 打包（Windows / Linux / macOS Apple Silicon） ----------
  build:
    name: 打包 ${{ matrix.name }}
    needs: typecheck
    if: github.event_name != 'pull_request'
    # 版本号在矩阵里算出来（三个矩阵项算出的值相同，互相覆盖无影响）；
    # release job 直接复用它，避免两处规则漂移
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64, NSIS + 便携版)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--bundles nsis"
          - name: Linux (x64, deb + AppImage)
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--bundles deb,appimage"
          - name: macOS (Apple Silicon, dmg)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin --bundles dmg"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      # 优先用本次 data job 建好的库；没有就跑 scripts/fetch-db.mjs 按 ①②③ 取，实在没有就放 0 字节占位
      - name: 尝试下载本次云端构建的数据库
        id: dbfromdata
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: db-poetry
          path: _db_from_data

      - name: 准备诗词数据库
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/resources
          size=0
          if [ -f _db_from_data/poetry_index.db ]; then
            size=$(wc -c < _db_from_data/poetry_index.db)
          fi
          if [ "$size" -gt 1048576 ]; then
            cp _db_from_data/poetry_index.db src-tauri/resources/poetry_index.db
            echo "使用本次云端构建的数据库（约 $((size / 1024 / 1024)) MB）"
          else
            echo "本次没有 data job 产物，改走 scripts/fetch-db.mjs"
            rm -rf _db_from_data
            node scripts/fetch-db.mjs
          fi

      # 只有拿到真实库（> 1MB）时才值得随 Release 上传；0 字节占位文件跳过
      - name: 检查数据库是否为真实库
        id: dbcheck
        shell: bash
        run: |
          f=src-tauri/resources/poetry_index.db
          size=$(wc -c < "$f" 2>/dev/null || echo 0)
          if [ "$size" -gt 1048576 ]; then
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "已获取真实数据库（约 $((size / 1024 / 1024)) MB）"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "未获取到真实数据库（当前 $size 字节），跳过 Release 上传"
          fi

      - name: 应用图标（仓库已内置 src-tauri/icons，仅在缺失时由 app-icon.svg 兜底生成）
        shell: bash
        run: |
          if [ -f src-tauri/icons/icon.ico ]; then
            echo "使用仓库内已有图标"
          else
            npm run tauri:icon || echo "图标生成失败，继续（可能缺少图标）"
          fi

      # Tauri 用 src-tauri/tauri.conf.json 的 version 命名安装包、写进应用属性（关于页看到的就是它），
      # 前端读的是 package.json 的 version —— 两边都同步，否则产物永远叫 0.1.0
      - name: 确定版本号并写入 package.json / tauri.conf.json
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="${INPUT_VERSION#v}"
            v="${v:-0.1.${GITHUB_RUN_NUMBER}}"
          fi
          echo "version=${v}" >> "$GITHUB_OUTPUT"
          node -e '
            const fs = require("fs");
            const v = process.argv[1];
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            console.log("版本号已写为 " + v);
          ' "$v"

      - name: 编译并打包
        run: npm run tauri:build -- ${{ matrix.args }}


      # Windows 便携版（免安装）：主程序 + 数据库资源打成 zip，解压双击即用，可放 U 盘
      - name: 打包 Windows 便携版（免安装 zip）
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DB_REAL: ${{ steps.dbcheck.outputs.real }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $name = "chinese-poetry_${ver}_windows-x64-portable"
          $stage = "portable/$name"
          New-Item -ItemType Directory -Force -Path "$stage/resources" | Out-Null

          # 编译产物（排除安装器）；Windows 未传 --target，因此就在 target/release 下
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
                 Where-Object { $_.Name -notmatch 'setup|installer' } |
                 Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw "没找到编译产物 exe，无法制作便携版" }
          Copy-Item $exe.FullName "$stage/"
          Copy-Item "src-tauri/resources/poetry_index.db" "$stage/resources/"

          # 说明文件按“这次到底有没有拿到真库”分别写
          $lines = @(
            "诗词 便携版 $ver（$($exe.Name)）",
            "====================================",
            "1. 解压到任意目录（路径含中文也可以）。",
            "2. 双击 $($exe.Name) 直接运行：无需安装、无需管理员权限，可放 U 盘随身携带。",
            "3. 依赖 WebView2 运行时：Windows 10/11 一般已自带；若启动时提示缺失，到",
            "   https://developer.microsoft.com/microsoft-edge/webview2/ 下载",
            "   Evergreen Standalone Installer 安装一次即可。"
          )
          if ($env:DB_REAL -eq 'true') {
            $lines += "4. 数据库：已内置在 resources/poetry_index.db，打开即用。"
          } else {
            $lines += "4. 数据库：包内的 resources/poetry_index.db 是 0 字节占位文件。首次启动会出现"
            $lines += "   「需要导入诗词数据库」引导页，点「选择数据库文件」选中你自己的 poetry_index.db 即可。"
          }
          $lines += "5. 卸载：直接删掉整个文件夹就行了。"
          Set-Content -Path "$stage/使用说明.txt" -Value ($lines -join "`r`n") -Encoding UTF8

          $zip = "portable/$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $stage -DestinationPath $zip -CompressionLevel Optimal
          Get-ChildItem portable | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 收集安装包
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          if-no-files-found: warn
          compression-level: 0 # 安装包本身已压缩，再压只会浪费时间
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
            portable/*.zip

      # 仓库里已经存过一份数据库资产就不再重复上传：216MB 一份就够，否则每次发布都塞一遍，
      # 既拖慢构建也白占配额。
      - name: 检查仓库里是否已有数据库资产
        id: dbasset
        if: matrix.platform == 'ubuntu-22.04' && steps.dbcheck.outputs.real == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
                --jq '[.[].assets[].name] | map(select(. == "poetry_index.db")) | length' 2>/dev/null || echo 0)
          echo "existing=$n" >> "$GITHUB_OUTPUT"
          echo "仓库里已有的 poetry_index.db 资产数量：$n"

      # 数据库作为临时产物交给 release job 一起发布（仅 Linux 那次、且确实拿到真库时）。
      # 好处：下次构建时 scripts/fetch-db.mjs 能从本仓库的 Release 自动取到 216MB 的库，
      # 不用把它提交进 Git，也不用每次手动填下载地址。
      # retention-days: 1 —— artifact 只当中转站，发完就不用留着占存储配额。
      - name: 上传数据库供发布使用（仅 Linux、且取到真实库时）
        if: matrix.platform == 'ubuntu-22.04' && steps.dbcheck.outputs.real == 'true' && steps.dbasset.outputs.existing == '0' && inputs.build_db != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-poetry
          path: src-tauri/resources/poetry_index.db
          compression-level: 0
          retention-days: 1

  # ---------- 3. 发布 Release（整个工作流里唯一创建 Release 的地方） ----------
  release:
    name: 发布 Release
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Release 标签直接用 build job 里算好的版本号，不再单独推导
      - name: 计算版本标签
        id: meta
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          {
            echo "tag=v${v}"
            echo "title=诗词 v${v}"
          } >> "$GITHUB_OUTPUT"
          echo "本次发布：正式版 v${v}"

      - name: 下载全部安装包
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist

      # 数据库有就一起带上；这次没拿到真库时该产物不存在，continue-on-error 保证不因此失败
      - name: 下载数据库（如果这次构建拿到了真库）
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: db-poetry
          path: dist

      - name: 列出待上传文件
        shell: bash
        run: ls -lh dist || true

      - name: 创建并发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.title }}
          draft: false # 不再停在草稿：草稿不会成为「最新 Release」，fetch-db 也就取不到里面的数据库
          prerelease: false
          generate_release_notes: true
          files: dist/**
