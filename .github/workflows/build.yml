# 由 GitHub Actions 编译 Tauri 桌面应用（本机没有编译条件，全部在云端完成）
#
# 触发方式：
#   1. 手动：Actions → Build → Run workflow（可选填数据库下载地址）
#   2. 打标签：git push origin v0.1.0  → 自动编译并创建 Release，附带安装包
#   3. PR：只做类型检查与前端构建，不打包
#
# 数据库（poetry_index.db，约 216MB）不提交进 Git，获取顺序见 scripts/fetch-db.mjs：
#   ① 本机已有文件  ② POETRY_DB_URL（手动触发时的 db_url 输入或仓库 Secret）
#   ③ 本仓库最新 Release 里的 poetry_index.db 资产  ④ 都没有 → 0 字节占位（应用启动后提示导入）
name: Build

on:
  workflow_dispatch:
    inputs:
      db_url:
        description: "poetry_index.db 下载地址（留空则尝试从本仓库最新 Release 获取）"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# 同一分支/标签只保留最新一次构建
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # 传给 scripts/fetch-db.mjs；手动触发时用输入值，否则用仓库 Secret（没配就是空）
  POETRY_DB_URL: ${{ github.event.inputs.db_url || secrets.POETRY_DB_URL }}
  CARGO_TERM_COLOR: always
  # 前端构建失败时不要静默降级
  CI: true

jobs:
  # ---------- 1. 前端类型检查（快速失败，不必等 Rust 编译） ----------
  typecheck:
    name: 类型检查 / 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: TypeScript 类型检查
        run: npm run typecheck # 类型错误必须修掉：build job 的 tauri:build 会触发 beforeBuildCommand（tsc + vite build），同样会跑一遍

      - name: 前端构建（vite build）
        run: npx vite build

  # ---------- 2. 打包（Windows / Linux / macOS 双架构） ----------
  build:
    name: 打包 ${{ matrix.name }}
    needs: typecheck
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64, NSIS)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: Linux (x64, deb + AppImage)
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - name: macOS (Apple Silicon, dmg)
            platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - name: macOS (Intel, dmg)
            platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Linux 系统依赖（WebKitGTK 等）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 缓存 npm 缓存目录
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: 获取诗词数据库
        run: node scripts/fetch-db.mjs

      - name: 应用图标（仓库已内置 src-tauri/icons，仅在缺失时由 app-icon.svg 兜底生成）
        shell: bash
        run: |
          if [ -f src-tauri/icons/icon.ico ]; then
            echo "使用仓库内已有图标"
          else
            npm run tauri:icon || echo "图标生成失败，继续（可能缺少图标）"
          fi

      - name: 编译并打包
        run: npm run tauri:build -- ${{ matrix.args }}

      - name: 收集安装包
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          if-no-files-found: warn
          compression-level: 0 # 安装包本身已压缩，再压只会浪费时间
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage

      - name: 挂到 Release（仅打标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/deb/*.deb
            src-tauri/target/*/release/bundle/rpm/*.rpm
            src-tauri/target/*/release/bundle/appimage/*.AppImage
